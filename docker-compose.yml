version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ecopulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ecopulse_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/infra/database/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./backend/infra/database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecopulse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: infra/docker/Dockerfile
    container_name: ecopulse_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      ENV: development
      API_KEY: ${API_KEY:-secreto_pim2_unip_2026}
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ecopulse_db
      STATION_LAT: -23.550520
      STATION_LON: -46.633308
      STATION_ALTITUDE: 760.0
      COVERAGE_RADIUS_KM: 5.0
    volumes:
      - ./backend/app:/app/app

volumes:
  pgdata:
    driver: local
